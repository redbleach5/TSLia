[project]
name = 'liya-voice-assistant'
version = '0.1.0'
description = 'Локальный голосовой ИИ-компаньон Лия'
requires-python = '>=3.11'
dependencies = []

[project.optional-dependencies]
ui = ['websockets>=12']
dev = ['ruff>=0.9']

[project.scripts]
liya = 'liya.cli:main'

[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[tool.pytest.ini_options]
pythonpath = ['src']
testpaths = ['tests']

[tool.ruff]
line-length = 120
target-version = 'py311'
src = ['src', 'tests']

[tool.ruff.lint]
select = ['E', 'F', 'I']
